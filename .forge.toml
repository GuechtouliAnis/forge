# .forge.toml — Forge project configuration
# Place at .forge.toml in your project root.
# All sections and keys are optional unless marked (required).
# If value is empty, forge falls back to default value


# ——— ENV ——————————————————————————————————————————————————————————————————————
[env]
# Default .env file path, relative to project root.
default_file = ".env"

# Default .env.example file path, relative to project root.
example_file = ".env.example"


# ——— ENV ADD ——————————————————————————————————————————————————————————————————
[env.add]
# Line ending style for appended keys.
# Values: "lf" | "crlf"
line_ending = "lf"


# ——— ENV CHECK ————————————————————————————————————————————————————————————————
[env.check]
# Minimum severity level to report. "warn" reports everything, "error" reports errors only.
# Values: "warn" | "error"
check_level = "warn"

# Keys to skip entirely during all checks, including conformity diff.
ignore_keys = ["AAA"]

# Suppress specific check categories globally.
# Valid codes: "empty_value", "trailing_whitespace", "consecutive_blank_lines",
#              "commented_key_has_value", "example_conformity", "example_has_value",
#              "file_ends_with_blank", "lowercase_key"
ignore_codes = ["example_conformity", "lowercase_key"]

# Keys that must exist in .env — Forge errors if any are missing.
required_keys = []

# Lowercase keys to allow without warning — e.g. ["version", "env"].
allowed_lowercase = []

# Maximum number of consecutive blank lines allowed.
# Set to -1 to disable.
max_consecutive_blanks = 2


# ——— ENV EXAMPLE —————————————————————————————————————————————————————————————
[env.example]
invalid_keys = "warn"   # "warn" | "skip" | "include"


# ——— GIT ADD ——————————————————————————————————————————————————————————————————
[git.add]
# Maximum file size allowed to be staged with forge git add in megabytes
# Set to -1 to disable
max_file_size_mb = -1

# Defines the behaviour of forge git add when a file exceeding
# "max_file_size_mb" is about to be staged
on_file_size_violation = "warn" # "warn" | "skip" | "fail"

# Glob patterns matched (case-insensitively) against each file's base name;
# matching files are always blocked from staging, regardless of size.
# Note: .env and env.default_file are unconditionally rejected and are not
# part of this list — they cannot be added here or removed from rejection.
blocklist_patterns = []

# ——— GIT CLEAN ————————————————————————————————————————————————————————————————
[git.clean]
# Days since last commit before a branch is considered dusty.
# Set to 0 to disable age-based detection.
stale_days = 30

# How many commits behind base before a branch is considered dusty.
# Set to 0 to disable behind-count detection.
commits_behind = 10

# Synchronize with the remote repository before evaluating branches.
# Set to false to perform a local-only diagnosis (faster, but may rely on outdated refs).
fetch_remote = false

# The maximum time in seconds to wait for a remote repository fetch to complete.
# Prevents the command from hanging indefinitely on slow or unresponsive connections.
fetch_timeout = 30

# The maximum number of concurrent workers used to evaluate branches.
# Higher values speed up evaluation on large repositories but consume more system resources.
max_workers = 8

# List of additional local branches that should always be shielded from deletion.
# Note: 'main', 'master', and the repository's default branch are always protected automatically.
protected_branches = []


# ——— GIT COMMIT ——————————————————————————————————————————————————————————————
[git.commit]
# Commit message format template. Use {domain} and {message} as placeholders.
# Set to "" to disable format enforcement (message is used as-is).
format = "[{domain}] {message}"

# Allowed domain prefixes for commit messages.
# Set to [""] to disable domain enforcement (useful when format omits {domain}).
domain = [
    "FEAT",   # New feature
    "FIX",    # Bug fix
    "REFACT", # Refactoring (no behaviour change)
    "DOCS",   # Documentation
    "TEST",   # Tests
    "CHORE",  # Maintenance (deps, CI, version bumps)
    "DEPRECATE",
]

# Maximum allowed length for the commit message
# Applies to {message} and not the whole format
# Set to 0 for no restriction.
message_max_length = 100

# Whether the domain prefix check should be case-sensitive.
# If true, "feat" will not match "FEAT".
# If false, "feat", "Feat", and "FEAT" are all treated as valid.
domaine_case_sensitive = true

# How to handle staged files that match a .gitignore rule (e.g. staged via
# `git add -f`, bypassing forge's own guardrails).
# "warn"  - print a warning and continue with the commit (default)
# "block" - refuse the commit until the ignored files are unstaged
staged_ignored_files_mode = "block"